apiVersion: batch/v1
kind: Job
metadata:
  name: hello-test
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: pytest
          image: ghcr.io/andrew-the-programmer/k8s-toy-tests:tests-v2
          imagePullPolicy: IfNotPresent
          env:
            - name: BASE_URL
              value: http://hello
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: hello-config
                  key: message
