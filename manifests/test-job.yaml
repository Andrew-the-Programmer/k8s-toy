apiVersion: batch/v1
kind: Job
metadata:
  name: hello-test
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr
      initContainers:
        - name: wait-for-app
          image: busybox:1.36
          env:
            - name: BASE_URL
              value: http://hello
          command: ["sh", "-c"]
          args:
            - |
              i=0
              until wget -qO- "$BASE_URL/healthz"; do
                i=$((i + 1))
                [ "$i" -ge 60 ] && exit 1
                sleep 2
              done
      containers:
        - name: pytest
          image: ghcr.io/andrew-the-programmer/k8s-toy-tests:tests-v1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: BASE_URL
              value: http://hello
