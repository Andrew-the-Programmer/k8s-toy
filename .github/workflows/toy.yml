name: toy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: toy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app: ${{ steps.meta-app.outputs.tags }}
      tests: ${{ steps.meta-tests.outputs.tags }}
    steps:
      - uses: actions/checkout@v5

      - name: Lowercase image names
        run: |
          echo "APP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-app" >> "$GITHUB_ENV"
          echo "TESTS_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-tests" >> "$GITHUB_ENV"

      - name: Choose tag
        run: echo "TAG=${{ github.head_ref || github.sha }}" >> "$GITHUB_ENV"

      - id: meta-app
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=raw,value=${{ env.TAG }}

      - id: meta-tests
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.TESTS_IMAGE }}
          tags: |
            type=raw,value=${{ env.TAG }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: app
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}

      - uses: docker/build-push-action@v7
        with:
          context: app-tests
          push: true
          tags: ${{ steps.meta-tests.outputs.tags }}

  pipeline:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.image.outputs.app }}
      TEST_IMAGE: ${{ needs.image.outputs.tests }}
      BUILD: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-kubectl@v4

      - name: Установить minikube
        run: |
          curl -fsSL -o minikube \
            https://storage.googleapis.com/minikube/releases/v1.38.1/minikube-linux-amd64
          chmod +x minikube
          sudo install minikube /usr/local/bin/minikube

      - name: Запустить кластер
        run: ./run.sh up

      - name: Создать pull secret
        run: |
          kubectl --context shiro-toy create secret docker-registry ghcr \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}"

      - name: Собрать и задеплоить
        run: ./run.sh deploy

      - name: Smoke-check
        run: ./run.sh check

      - name: Тесты
        run: ./run.sh test

      - name: Логи при падении
        if: failure()
        continue-on-error: true
        run: |
          kubectl --context shiro-toy get pods
          kubectl --context shiro-toy describe deployment hello
          kubectl --context shiro-toy logs deployment/hello --tail=50
          kubectl --context shiro-toy logs job/hello-test --tail=100 || true

      - name: Удалить кластер
        if: always()
        run: ./run.sh down
