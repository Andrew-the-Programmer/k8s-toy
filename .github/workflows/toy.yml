name: toy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: toy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v5

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  pipeline:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-kubectl@v4

      - name: Установить minikube
        run: |
          curl -fsSL -o minikube \
            https://storage.googleapis.com/minikube/releases/v1.38.1/minikube-linux-amd64
          chmod +x minikube
          sudo install minikube /usr/local/bin/minikube

      - name: Запустить кластер
        run: ./run.sh up

      - name: Создать pull secret
        run: |
          kubectl --context shiro-toy create secret docker-registry ghcr \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}"

      - name: Собрать и задеплоить
        env:
          IMAGE: ${{ needs.image.outputs.ref }}
          BUILD: "0"
        run: ./run.sh deploy

      - name: Smoke-check
        run: ./run.sh check

      - name: Логи при падении
        if: failure()
        continue-on-error: true
        run: |
          kubectl --context shiro-toy get pods
          kubectl --context shiro-toy describe deployment hello
          kubectl --context shiro-toy logs deployment/hello --tail=50

      - name: Удалить кластер
        if: always()
        run: ./run.sh down
